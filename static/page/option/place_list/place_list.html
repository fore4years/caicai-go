<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>车位管理</title>
    <link rel="stylesheet" href="place_list.css">
    <script src="../../../js/system.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- 引入组件库 -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>

<!-- 创建一个根元素 -->
<div class="home" id="home">

    <!-- 搜索框 -->
    <div class="search">
        <el-input
                size="mini"
                style="width: 200px; margin-right:10px; font-size:13px;"
                v-model="params.tiaojian"
                placeholder="请输入车位编号查询"
        ></el-input>
        <el-input
                size="mini"
                style="width: 200px; margin-right:10px; font-size:13px;"
                v-model="params.ownerid"
                placeholder="请输入业主id查询"
        ></el-input>
        <el-button size="mini" type="info" @click="sousuoanniu(1)" plain>查询</el-button>
        <el-button size="mini" type="warning" @click="reset()" plain>重置</el-button>
    </div>

    <!-- 添加-删除 -->
    <div class="search" style="margin-top: 10px;">
        <el-button size="mini" type="danger" @click="delmush()" plain :disabled="!isAdmin" :title="isAdmin ? '批量删除选中的车位信息' : '无权限操作，请联系管理员'">批量删除</el-button>
    </div>

    <!-- 表格 -->
    <div class="search" style="margin-top: 10px; font-size:12px;">
        <el-table
                ref="multipleTable"
                :data="tableData"
                tooltip-effect="dark"
                style="width: 100%"
                @selection-change="handleSelectionChange"
        >
            <el-table-column type="selection" width="55"></el-table-column>
            <el-table-column type="index" label="序号" width="80"></el-table-column>
            <el-table-column prop="placeid" label="车位编号" width="150"></el-table-column>
            <el-table-column prop="ownerid" label="所属业主" width="300"></el-table-column>
            <el-table-column prop="phone" label="联系电话" width="150">
                <template slot-scope="scope">
                    <span v-if="scope.row.phone">{{ scope.row.phone }}</span>
                    <span v-else>未绑定</span>
                </template>
            </el-table-column>
            <el-table-column prop="address" label="车位地址" width="320">
                <template slot-scope="scope">
                    {{ scope.row.province }}{{ scope.row.city }}{{ scope.row.district }}{{ scope.row.streer }}
                </template>
            </el-table-column>
            <el-table-column prop="state" label="状态" width="120">
                <template slot-scope="scope">
                    <span :style="{ color: getStatusColor(scope.row.state) }">
                        {{ formatStatus(scope.row.state) }}
                    </span>
                </template>
            </el-table-column>
            <el-table-column width="150px" label="操作">
                <template slot-scope="scope">
                    <el-button size="mini" type="primary" @click="openXq(scope.row.placeid)">查看详情</el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!-- 分页 -->
    <div style="margin-top:10px; float: right">
        <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="params.pageNum"
                :page-sizes="[10, 20, 30]"
                :page-size="params.pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="total">
        </el-pagination>
    </div>

</div>

<script>
    // 将vue挂载到id为home的根元素上
    let vm = new Vue({
        el: "#home",
        data() {
            return {
                formLabelWidth: '100px', //表单内每行的宽度
                isAdmin: false, // 管理员权限状态
                //表单校验
                params: {
                    tiaojian: "",
                    ownerid: "",
                    pageNum: 1,
                    pageSize: 10
                },
                total: 0,
                tableData: [],
                multipleSelection: [],
                yisousuo: false
            };
        },
        // 钩子函数 -- 初始化
        created() {
            this.checkAdminStatus();
            this.loadData();
        },
        mounted() {
            // 添加键盘事件监听器，Enter键触发查询
            document.addEventListener('keydown', this.handleKeyDown);
        },
        beforeDestroy() {
            // 移除键盘事件监听器
            document.removeEventListener('keydown', this.handleKeyDown);
        },
        methods: {
            // 处理键盘按下事件
            handleKeyDown(event) {
                if ((event.keyCode === 13 || event.key === 'Enter')) {
                    this.sousuoanniu(1);
                }
            },
            // 检查管理员权限状态
            checkAdminStatus() {
                // 从Cookie中获取用户信息
                let username = this.getCookie('username');
                if (username) {
                    // 发送请求检查管理员状态
                    axios.get('/system/checkAdmin', {
                        params: {
                            account: username
                        }
                    }).then(response => {
                        if (response.data.code === 200) {
                            this.isAdmin = response.data.data.isAdmin === 1 || response.data.data.isAdmin === 2;
                        } else {
                            this.isAdmin = false;
                            console.error('获取管理员状态失败:', response.data.msg);
                        }
                    }).catch(error => {
                        this.isAdmin = false;
                        console.error('检查管理员状态出错:', error);
                    });
                } else {
                    this.isAdmin = false;
                    console.warn('未找到用户信息，默认非管理员状态');
                }
            },

            // 获取Cookie中的用户信息
            getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
            },

            loadData() {
                const loading = this.$loading({
                    lock: true,
                    text: '数据加载中...',
                    background: 'rgba(0, 0, 0, 0.7)'
                });
                // 更新页面数据
                this.getPage(1);

                loading.close(); // 关闭加载提示
            },

            // 获取数据
            getPage(page) {
                this.params.pageNum = page;
                
                if (this.yisousuo) {
                    this.sousuoanniu(page);
                    return;
                }
                
                this.yisousuo = false;
                this.params.tiaojian = '';
                
                axios.get('/system/allPlace', {
                    params: {
                        current: this.params.pageNum,
                        size: this.params.pageSize
                    }
                }).then(res => {
                    this.total = res.data.max;
                    
                    const promises = res.data.list.map(item => {
                        return axios.get('/system/getUserPhone', {
                            params: {
                                ownerid: item.ownerid
                            }
                        }).then(phoneRes => {
                            item.phone = phoneRes.data;
                            return item;
                        });
                    });
                    
                    Promise.all(promises).then(updatedList => {
                        this.tableData = updatedList;
                    });
                });
            },

            // 搜索按钮
            sousuoanniu(page) {
                this.params.pageNum = page;
                this.yisousuo = false;
                
                axios.get('/system/place_list/sousuo', {
                    params: {
                        tiaojian: this.params.tiaojian,
                        ownerid: this.params.ownerid,
                        page: this.params.pageNum,
                        length: this.params.pageSize
                    }
                }).then(res => {
                    if (!res.data) {
                        this.$message({
                            message: '未搜索到数据',
                            type: 'warning'
                        });
                        this.total = 0;
                        this.tableData = [];
                    } else {
                        this.total = res.data.max;
                        
                        const promises = res.data.list.map(item => {
                            return axios.get('/system/getUserPhone', {
                                params: {
                                    ownerid: item.ownerid
                                }
                            }).then(phoneRes => {
                                item.phone = phoneRes.data;
                                return item;
                            });
                        });
                        
                        Promise.all(promises).then(updatedList => {
                            this.tableData = updatedList;
                            
                            if (!this.yisousuo) {
                                this.yisousuo = true;
                                this.$message({
                                    message: `为您搜索到${res.data.max}条数据！`,
                                    type: 'success'
                                });
                            }
                        });
                    }
                });
            },

            // 批量删除
            delmush() {
                if (this.multipleSelection.length === 0) {
                    this.$message({
                        message: '未选中任何选项！',
                        type: 'warning'
                    });
                    return;
                }
                
                this.$confirm('确定批量删除吗?', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    const ids = this.multipleSelection.map(item => item.placeid);
                    axios.post('/system/placesDel', {
                        xuanzhong: ids
                    }).then(res => {
                        this.$message({
                            message: res.data,
                            type: 'success'
                        });
                        this.getPage(1);
                    });
                }).catch(() => {
                    this.$message({
                        type: 'info',
                        message: '已取消删除'
                    });
                });
            },

            // 查看详情
            openXq(placeid) {
                console.log("查看详情ID: ", placeid);
                if (!placeid) {
                    this.$message.error("无法查看详情：placeid不存在");
                    return;
                }
                window.location.href = "../yezhuXiangqing/yezhuXiangqing.html?placeid=" + placeid + "&from=place_list";
            },

            // 存放选中的数据，要批量删除的数据
            handleSelectionChange(val) {
                this.multipleSelection = val;
            },

            // 重置
            reset() {
                this.params.tiaojian = "";
                this.params.ownerid = "";
                this.yisousuo = false;
                this.getPage(1);
            },

            // 分页
            handleSizeChange(pageSize) {
                this.params.pageSize = pageSize;
                this.getPage(this.params.pageNum);
            },

            handleCurrentChange(pageNum) {
                this.params.pageNum = pageNum;
                this.getPage(pageNum);
            },

            formatStatus(status) {
                if (status === '可使用') return '已通过';
                else if (status === '待加锁' || status === '待审核') return '待审核';
                else return status;
            },
            
            getStatusColor(status) {
                if (status === '可使用') return 'green';
                else if (status === '待加锁' || status === '待审核') return 'orange';
                else return 'gray';
            },
        },
    });
</script>

</body>
</html>
