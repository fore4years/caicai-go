<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>邻享充入网</title>
    <link rel="stylesheet" href="private_pile_audit.css">
    <script src="../../../js/system.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- 引入组件库 -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>

<body>
<!-- 创建一个根元素 -->
<div class="home" id="home">

    <!-- 搜索框 -->
    <div class="search">
        <el-input
                size="mini"
                style="width: 200px; margin-right:10px; font-size:13px;"
                v-model="params.phone"
                placeholder="请输入手机号查询"
        ></el-input>
        <el-button size="mini" type="info" @click="searchByPhone()" plain>查询</el-button>
        <el-button size="mini" type="warning" @click="reset()" plain>重置</el-button>
    </div>

    <!-- 批量操作按钮 -->
    <div class="search" style="margin-top: 10px;">
        <el-button size="mini" type="success" @click="batchApprove()" :disabled="!isAdmin" :title="isAdmin ? '批量通过选中的审核申请' : '无权限操作，请联系管理员'" plain>批量通过</el-button>
        <el-button size="mini" type="danger" @click="batchReject()" :disabled="!isAdmin" :title="isAdmin ? '批量拒绝选中的审核申请' : '无权限操作，请联系管理员'" plain>批量拒绝</el-button>
    </div>

    <!-- 表格 -->
    <div class="search" style="margin-top: 10px; font-size:12px;">
        <el-table
                ref="multipleTable"
                :data="tableData"
                tooltip-effect="dark"
                style="width: 100%"
                @selection-change="handleSelectionChange"
        >
            <el-table-column type="selection" width="55"></el-table-column>
            <el-table-column prop="id" label="序号" width="80"></el-table-column>
            <el-table-column prop="name" label="用户姓名" width="120"></el-table-column>
            <el-table-column prop="phone" label="手机号" width="150"></el-table-column>
            <el-table-column prop="address" label="充电桩地址" width="300"></el-table-column>
            <el-table-column prop="createTime" label="申请时间" width="200"></el-table-column>
            <el-table-column prop="status" label="状态" width="150">
                <template slot-scope="scope">
                    <span :style="{ color: getStatusColor(scope.row.status) }">
                        {{ formatStatus(scope.row.status) }}
                    </span>
                </template>
            </el-table-column>
            <el-table-column width="200px" label="操作">
                <template slot-scope="scope">
                    <el-button size="mini" type="success" @click="handleApprove(scope.$index, scope.row)" :disabled="!isAdmin" :title="isAdmin ? '通过该审核申请' : '无权限操作，请联系管理员'">通过</el-button>
                    <el-button size="mini" type="danger" @click="handleReject(scope.$index, scope.row)" :disabled="!isAdmin" :title="isAdmin ? '拒绝该审核申请' : '无权限操作，请联系管理员'">拒绝</el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!-- 分页 -->
    <div style="margin-top:10px; float: right">
        <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="params.pageNum"
                :page-sizes="[10, 20, 30]"
                :page-size="params.pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="total">
        </el-pagination>
    </div>

</div>

<script>
    let vm = new Vue({
        el: "#home",
        data() {
            return {
                params: {
                    phone: "",
                    pageNum: 1,
                    pageSize: 10
                },
                total: 0,
                tableData: [],
                multipleSelection: [],
                isAdmin: false
            };
        },
        created() {
            this.checkAdminStatus();
            this.loadData();
        },
        mounted() {
            // 添加键盘事件监听器，Enter键触发查询
            document.addEventListener('keydown', this.handleKeyDown);
        },
        beforeDestroy() {
            // 移除键盘事件监听器
            document.removeEventListener('keydown', this.handleKeyDown);
        },
        methods: {
            // 处理键盘按下事件
            handleKeyDown(event) {
                if ((event.keyCode === 13 || event.key === 'Enter')) {
                    this.searchByPhone();
                }
            },
            // 检查管理员状态
            checkAdminStatus() {
                // 从Cookie中获取用户信息
                let username = this.getCookie('username');
                if (username) {
                    // 发送请求检查管理员状态
                    axios.get('/system/checkAdmin', {
                        params: {
                            account: username
                        }
                    }).then(response => {
                        if (response.data.code === 200) {
                            this.isAdmin = response.data.data.isAdmin === 1 || response.data.data.isAdmin === 2;
                        } else {
                            this.isAdmin = false;
                            console.error('获取管理员状态失败:', response.data.msg);
                        }
                    }).catch(error => {
                        this.isAdmin = false;
                        console.error('检查管理员状态出错:', error);
                    });
                } else {
                    this.isAdmin = false;
                    console.warn('未找到用户信息，默认非管理员状态');
                }
            },

            // 从Cookie获取值
            getCookie(name) {
                let value = '; ' + document.cookie;
                let parts = value.split('; ' + name + '=');
                if (parts.length === 2) {
                    return parts.pop().split(';').shift();
                }
                return null;
            },
            
            loadData() {
                const loading = this.$loading({
                    lock: true,
                    text: '数据加载中...',
                    background: 'rgba(0, 0, 0, 0.7)'
                });
                this.init();
                loading.close();
            },

            init() {
                axios.get('/system/privatePile/getAuditList', {
                    params: {
                        current: this.params.pageNum,
                        size: this.params.pageSize,
                    }
                }).then(res => {

                    console.log("返回参数:", res)

                    // 这里暂不知道是什么问题，接口返回的格式不一样，先这样处理
                    const data = res.data ? res.data.data : res;

                    this.tableData = data.list;
                    this.total = data.total;
                })
            },

            formatStatus(status) {
                switch (status) {
                    case 1:
                        return '已通过';
                    case -1:
                        return '未通过';
                    case 0:
                        return '待审核';
                    default:
                        return '未知状态';
                }
            },

            getStatusColor(status) {
                switch (status) {
                    case 1:
                        return 'green';
                    case -1:
                        return 'red';
                    case 0:
                        return 'orange';
                    default:
                        return 'black';
                }
            },

            searchByPhone() {
                this.params.phone = this.params.phone.trim();
                if (this.params.phone === "") {
                    this.init();
                } else {
                    axios.get('/system/privatePile/searchByPhone', {
                        params: {
                            phone: this.params.phone,
                            current: this.params.pageNum,
                            size: this.params.pageSize
                        }
                    }).then(res => {
                        console.log("返回参数:", res)

                        // 这里暂不知道是什么问题，接口返回的格式不一样，先这样处理
                        const data = res.data ? res.data.data : res;

                        this.tableData = data.list;
                        this.total = data.total;
                    })
                }
            },

            handleApprove(index, row) {
                this.updateStatus(row.id, 1);
            },

            handleReject(index, row) {
                this.updateStatus(row.id, -1);
            },

            updateStatus(id, status) {
                axios.post('/system/privatePile/updateStatus', {
                    id: id,
                    status: status
                }).then(res => {
                    console.log("返回参数:", res)
                    if (res) {
                        this.$message({
                            message: "操作成功!",
                            type: "success"
                        });
                        this.init();
                    } else {
                        this.$message({
                            message: "操作失败!",
                            type: "error"
                        });
                    }
                })
            },

            batchApprove() {
                this.batchUpdate(1);
            },

            batchReject() {
                this.batchUpdate(-1);
            },

            batchUpdate(status) {
                if (this.multipleSelection.length === 0) {
                    this.$message({
                        message: "请选择要操作的记录!",
                        type: "warning"
                    });
                    return;
                }

                const ids = this.multipleSelection.map(item => item.id);
                axios.post('/system/privatePile/batchUpdateStatus', {
                    ids: ids,
                    status: status
                }).then(res => {
                    if (res) {
                        this.$message({
                            message: "批量操作成功!",
                            type: "success"
                        });
                        this.init();
                    } else {
                        this.$message({
                            message: "批量操作失败!",
                            type: "error"
                        });
                    }
                })
            },

            handleSelectionChange(val) {
                this.multipleSelection = val;
            },

            reset() {
                this.params.phone = "";
                this.init();
            },

            handleSizeChange(pageSize) {
                this.params.pageSize = pageSize;
                this.init();
            },

            handleCurrentChange(pageNum) {
                this.params.pageNum = pageNum;
                this.init();
            }
        }
    });
</script>

</body>
</html>
