<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" name="referrer" content="never">
    <title>运营管理</title>
    <link rel="stylesheet" href="private_charging.css">
    <script src="../../../js/system.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- 引入组件库 -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

</head>

<body>

<!-- 创建一个根元素 -->
<div class="home" id="home">

    <!-- 搜索框 -->
    <div class="search" style="display: flex; align-items: center; flex-wrap: wrap;">
        <el-input size="mini" style="width: 200px; margin-right:10px; font-size:13px;" v-model="searchParams.name" placeholder="请输入车位名查询"></el-input>
        <el-input size="mini" style="width: 200px; margin-right:10px; font-size:13px;" v-model="searchParams.spacesCode" placeholder="请输入车位编号查询"></el-input>
        <el-input size="mini" style="width: 200px; margin-right:10px; font-size:13px;" v-model="searchParams.id" placeholder="请输入车位号查询"></el-input>
        <el-input size="mini" style="width: 200px; margin-right:10px; font-size:13px;" v-model="searchParams.lockId" placeholder="请输入车位锁ID查询"></el-input>
        <el-input size="mini" style="width: 200px; margin-right:10px; font-size:13px;" v-model="searchParams.chargingGunId" placeholder="请输入充电枪ID查询"></el-input>
        <el-button size="mini" type="info" style="margin-right:10px;" @click="searchPiles" plain>查询</el-button>
        <el-button size="mini" type="warning" @click="resetSearch" plain>重置</el-button>
    </div>

    <!-- 表格 -->
    <div class="search" style="margin-top: 10px; font-size:12px;">
        <el-table ref="multipleTable" :data="pileList" tooltip-effect="dark" style="width: 100%">
            <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
            <el-table-column prop="place" label="停车场位置" width="350" align="center" show-overflow-tooltip></el-table-column>
            <el-table-column prop="name" label="车位名" width="280" align="center" show-overflow-tooltip></el-table-column>
            <el-table-column prop="spacesCode" label="车位编号" width="150" align="center" show-overflow-tooltip>
                <template slot-scope="scope">
                    <span>{{ scope.row.spacesCode || '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="lockId" label="车位锁ID" width="150" align="center" show-overflow-tooltip>
                <template slot-scope="scope">
                    <span>{{ scope.row.lockId || '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="id" label="车位号" width="100" align="center" show-overflow-tooltip></el-table-column>
            <el-table-column prop="chargingGunId" label="充电枪ID" width="100" align="center" show-overflow-tooltip>
                <template slot-scope="scope">
                    <span>{{ scope.row.chargingGunId || '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="service" label="基本服务费" width="120" align="center">
                <template slot-scope="scope">
                    <span>{{ scope.row.service ? scope.row.service + '元' : '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="serviceFee" label="优惠后服务费" width="120" align="center">
                <template slot-scope="scope">
                    <span>{{ scope.row.serviceFee ? scope.row.serviceFee + '元' : '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="overtimeFee" label="收取占位费" width="120" align="center">
                <template slot-scope="scope">
                    <span>{{ scope.row.overtimeFee === 1 ? '开启' : '关闭' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="priceMode" label="电价模式" width="120" align="center">
                <template slot-scope="scope">
                    <span>{{ scope.row.priceMode === 1 ? '单一制电价' : (scope.row.priceMode === 2 ? '两部制电价' : '常规电价') }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="pwm" label="PWM占空比" width="120" align="center">
                <template slot-scope="scope">
                    <span>{{ scope.row.pwm !== null && scope.row.pwm !== undefined ? scope.row.pwm + '%' : '未设置' }}</span>
                </template>
            </el-table-column>
            <el-table-column width="180" label="操作" align="center" fixed="right">
                <template slot-scope="scope">
                    <el-button size="mini" type="primary" @click="showDetail(scope.row)" plain>详情</el-button>
                    <el-button size="mini" type="warning" @click="editPile(scope.row)" :disabled="!isAdmin" :title="isAdmin ? '编辑该停车位信息' : '无权限操作，请联系管理员'" plain>编辑</el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!-- 分页 -->
    <div style="margin-top:10px; float: right">
        <el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange" :current-page="currentPage" :page-sizes="[10, 20, 30]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="total">
        </el-pagination>
    </div>

    <!-- 编辑停车位弹窗 -->
    <el-dialog title="编辑车位信息" :visible.sync="showEditModal" width="600px" :close-on-click-modal="false">
        <div class="modal-body">
            <el-form label-width="140px">
                <el-form-item label="车位名：">
                    <el-input v-model="editPileData.name" placeholder="车位名" disabled></el-input>
                </el-form-item>
                <el-form-item label="车位锁ID：">
                    <el-input v-model="editPileData.lockId" placeholder="车位锁ID" disabled></el-input>
                </el-form-item>
                <el-form-item label="充电枪ID：">
                    <el-input v-model="editPileData.chargingGunId" placeholder="充电枪ID" disabled></el-input>
                </el-form-item>
                <el-form-item label="基本服务费：">
                    <el-input v-model="editPileData.service" placeholder="请输入基本服务费"></el-input>
                </el-form-item>
                <el-form-item label="优惠后服务费：">
                    <el-input v-model="editPileData.serviceFee" placeholder="请输入优惠后服务费"></el-input>
                </el-form-item>
                <el-form-item label="收取超时占位费：">
                    <el-radio-group v-model="editPileData.overtimeFee">
                        <el-radio :label="1">是</el-radio>
                        <el-radio :label="0">否</el-radio>
                    </el-radio-group>
                </el-form-item>
                <el-form-item label="电价模式：">
                    <el-radio-group v-model="editPileData.priceMode">
                        <el-radio :label="0">常规电价</el-radio>
                        <el-radio :label="1">单一制电价</el-radio>
                        <el-radio :label="2">两部制电价</el-radio>
                    </el-radio-group>
                </el-form-item>
            </el-form>
        </div>
        <span slot="footer" class="dialog-footer">
                <el-button @click="showEditModal = false" size="mini">取消</el-button>
                <el-button type="primary" @click="savePile" size="mini">保存</el-button>
            </span>
    </el-dialog>

    <!-- 详情弹窗 -->
    <el-dialog title="充电统计" :visible.sync="showDetailModal" width="600px" :close-on-click-modal="false">
        <div class="modal-body">
            <el-form label-width="120px">
                <el-form-item label="车位编号：">
                    <el-input v-model="detailData.spacesCode" placeholder="车位编号" disabled></el-input>
                </el-form-item>
                <el-form-item label="车位名：">
                    <el-input v-model="detailData.name" placeholder="车位名" disabled></el-input>
                </el-form-item>
                
                <!-- 本周统计 -->
                <el-divider content-position="left">本周统计</el-divider>
                <el-form-item label="本周充电度数：">
                    <el-input v-model="detailData.weeklyChargingDegree" placeholder="本周充电度数" disabled>
                        <template slot="append">度</template>
                    </el-input>
                </el-form-item>
                <el-form-item label="本周电费统计：">
                    <el-input v-model="detailData.weeklyElectricityFee" placeholder="本周电费统计" disabled>
                        <template slot="append">元</template>
                    </el-input>
                </el-form-item>
                
                <!-- 本月统计 -->
                <el-divider content-position="left">本月统计</el-divider>
                <el-form-item label="本月充电度数：">
                    <el-input v-model="detailData.totalChargingDegree" placeholder="本月充电度数" disabled>
                        <template slot="append">度</template>
                    </el-input>
                </el-form-item>
                <el-form-item label="本月电费统计：">
                    <el-input v-model="detailData.totalElectricityFee" placeholder="本月电费统计" disabled>
                        <template slot="append">元</template>
                    </el-input>
                </el-form-item>
            </el-form>
        </div>
        <span slot="footer" class="dialog-footer">
                <el-button @click="showDetailModal = false" size="mini">关闭</el-button>
            </span>
    </el-dialog>

</div>

<script>
    // 将vue挂载到id为home的根元素上
    let vm = new Vue({
        el: "#home",
        data() {
                return {
                    pileList: [],
                    total: 0,
                    pageSize: 10,
                    currentPage: 1,
                    searchParams: {
                        name: '',
                        spacesCode: '',
                        id: '',
                        lockId: '',
                        chargingGunId: ''
                    },
                    showEditModal: false,
                    editPileData: {},
                    showDetailModal: false,
                    detailData: {
                        spacesCode: '',
                        name: '',
                        weeklyChargingDegree: '',
                        weeklyElectricityFee: '',
                        totalChargingDegree: '',
                        totalElectricityFee: ''
                    },
                    isAdmin: false
                };
            },
        // 钩子函数 -- 初始化
        created() {
            this.checkAdminStatus();
            this.loadData();
        },
        mounted() {
            // 添加键盘事件监听器，Enter键触发查询
            document.addEventListener('keydown', this.handleKeyDown);
        },
        beforeDestroy() {
            // 移除键盘事件监听器
            document.removeEventListener('keydown', this.handleKeyDown);
        },
        methods: {
            // 处理键盘按下事件
            handleKeyDown(event) {
                // 如果按下的是Enter键，并且弹窗没有打开
                if ((event.keyCode === 13 || event.key === 'Enter') && !this.showEditModal && !this.showDetailModal) {
                    this.searchPiles();
                }
            },
            // 检查管理员状态
            checkAdminStatus() {
                // 从Cookie中获取用户信息
                let username = this.getCookie('username');
                if (username) {
                    // 发送请求检查管理员状态
                    axios.get('/system/checkAdmin', {
                        params: {
                            account: username
                        }
                    }).then(response => {
                        if (response.data.code === 200) {
                            this.isAdmin = response.data.data.isAdmin === 1 || response.data.data.isAdmin === 2;
                        } else {
                            this.isAdmin = false;
                            console.error('获取管理员状态失败:', response.data.msg);
                        }
                    }).catch(error => {
                        this.isAdmin = false;
                        console.error('检查管理员状态出错:', error);
                    });
                } else {
                    this.isAdmin = false;
                    console.warn('未找到用户信息，默认非管理员状态');
                }
            },

            // 从Cookie获取值
            getCookie(name) {
                let value = '; ' + document.cookie;
                let parts = value.split('; ' + name + '=');
                if (parts.length === 2) {
                    return parts.pop().split(';').shift();
                }
                return null;
            },

            loadData() {
                const loading = this.$loading({
                    lock: true,
                    text: '数据加载中...',
                    background: 'rgba(0, 0, 0, 0.7)'
                });
                // 更新页面数据
                this.searchPiles();

                loading.close(); // 关闭加载提示
            },

            searchPiles() {
                // 调用后端停车位管理API - 使用ParkingSpacesController中的getAll接口
                axios.get('/system/parkingSpaces/getAll', {
                    params: {
                        name: this.searchParams.name,
                        spacesCode: this.searchParams.spacesCode,
                        id: this.searchParams.id,
                        lockId: this.searchParams.lockId,
                        chargingGunId: this.searchParams.chargingGunId,
                        current: this.currentPage,
                        size: this.pageSize
                    }
                })
                    .then(res => {
                        // 处理API响应 - 参考OrderManage.html的处理方式
                        const data = res.data ? res.data.data : res;
                        
                        // 1. 字段映射：直接使用后端返回的字段
                        const mappedData = data.list.map(item => ({
                            id: item.id || '', // 车位号
                            place: item.place || '', // 位置
                            name: item.name || '', // 车位名
                            spacesCode: item.spacesCode || '', // 车位编号
                            lockId: item.lockId || '', // 车位锁ID
                            chargingGunId: item.chargingGunId || '', // 充电枪ID
                            service: item.service || '', // 基本服务费
                            serviceFee: item.serviceFee || '', // 优惠后服务费
                            overtimeFee: item.overtimeFee || 0, // 收取占位费
                            priceMode: item.priceMode || 0, // 电价模式
                            pwm: item.chargingGun ? item.chargingGun.pwm : null // PWM占空比
                        }));

                        this.pileList = mappedData;
                        this.total = data.total;
                    })
                    .catch(err => {
                        console.error('获取车位列表失败:', err);
                        console.error('错误详情:', err.response);
                        const errorMsg = err.response && err.response.data && err.response.data.msg ? err.response.data.msg : '获取车位列表失败';
                        this.$message.error(errorMsg);
                        this.pileList = [];
                        this.total = 0;
                    });
            },

            resetSearch() {
                this.searchParams = {
                    name: '',
                    spacesCode: '',
                    id: '',
                    lockId: '',
                    chargingGunId: ''
                };
                this.currentPage = 1;
                this.searchPiles();
            },

            handleSizeChange(pageSize) {
                this.pageSize = pageSize;
                this.searchPiles();
            },

            handleCurrentChange(pageNum) {
                this.currentPage = pageNum;
                this.searchPiles();
            },

            // 显示详情
            showDetail(row) {
                // 设置基本信息
                this.detailData = {
                    spacesCode: row.spacesCode || '',
                    name: row.name || '',
                    weeklyChargingDegree: '加载中...',
                    weeklyElectricityFee: '加载中...',
                    totalChargingDegree: '加载中...',
                    totalElectricityFee: '加载中...'
                };
                
                // 显示弹窗
                this.showDetailModal = true;
                
                // 同时调用本周和本月统计接口
                this.loadWeeklyStatistics(row.spacesCode);
                this.loadMonthlyStatistics(row.spacesCode);
            },

            // 加载本周统计信息
            loadWeeklyStatistics(spacesCode) {
                if (!spacesCode) {
                    this.$message.error('车位编号为空，无法获取统计信息');
                    return;
                }
                
                axios.get('/system/parkingSpaces/getWeeklyChargingStatistics', {
                    params: {
                        spacesCode: spacesCode
                    }
                })
                .then(res => {
                    const data = res.data ? res.data.data : res;
                    
                    if (data) {
                        // 更新统计信息
                        this.detailData.weeklyChargingDegree = data.totalChargingDegree || '0';
                        this.detailData.weeklyElectricityFee = data.totalElectricityFee || '0';
                    } else {
                        this.$message.error('获取本周统计信息失败');
                        this.detailData.weeklyChargingDegree = '获取失败';
                        this.detailData.weeklyElectricityFee = '获取失败';
                    }
                })
                .catch(err => {
                    console.error('获取本周统计信息失败:', err);
                    const errorMsg = err.response && err.response.data && err.response.data.msg ? err.response.data.msg : '获取本周统计信息失败';
                    this.$message.error(errorMsg);
                    this.detailData.weeklyChargingDegree = '获取失败';
                    this.detailData.weeklyElectricityFee = '获取失败';
                });
            },

            // 加载本月统计信息
            loadMonthlyStatistics(spacesCode) {
                if (!spacesCode) {
                    this.$message.error('车位编号为空，无法获取统计信息');
                    return;
                }
                
                axios.get('/system/parkingSpaces/getMonthlyChargingStatistics', {
                    params: {
                        spacesCode: spacesCode
                    }
                })
                .then(res => {
                    const data = res.data ? res.data.data : res;
                    
                    if (data) {
                        // 更新统计信息
                        this.detailData.totalChargingDegree = data.totalChargingDegree || '0';
                        this.detailData.totalElectricityFee = data.totalElectricityFee || '0';
                    } else {
                        this.$message.error('获取统计信息失败');
                        this.detailData.totalChargingDegree = '获取失败';
                        this.detailData.totalElectricityFee = '获取失败';
                    }
                })
                .catch(err => {
                    console.error('获取本月统计信息失败:', err);
                    const errorMsg = err.response && err.response.data && err.response.data.msg ? err.response.data.msg : '获取统计信息失败';
                    this.$message.error(errorMsg);
                    this.detailData.totalChargingDegree = '获取失败';
                    this.detailData.totalElectricityFee = '获取失败';
                });
            },

            // 编辑停车位
            editPile(row) {
                this.editPileData = { ...row };
                this.showEditModal = true;
            },

            // 保存停车位服务费
            savePile() {
                const params = new URLSearchParams();
                params.append('id', this.editPileData.id);
                if (this.editPileData.service) {
                    params.append('serviceAmount', this.editPileData.service);
                }
                if (this.editPileData.serviceFee) {
                    params.append('serviceFee', this.editPileData.serviceFee);
                }
                if (this.editPileData.overtimeFee !== undefined && this.editPileData.overtimeFee !== null) {
                    params.append('overtimeFee', this.editPileData.overtimeFee);
                }
                if (this.editPileData.priceMode !== undefined && this.editPileData.priceMode !== null) {
                    params.append('priceMode', this.editPileData.priceMode);
                }

                axios.post('/system/parkingSpaces/updateServiceAndFeeById', params, {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                })
                    .then(res => {
                        const data = res.data ? res.data.data : res;

                        if (data) {
                            this.$message.success('车位服务费更新成功');
                            this.showEditModal = false;
                            // 刷新停车位列表
                            this.searchPiles();
                        } else {
                            const errorMsg = res && res.data && res.data.msg ? res.data.msg : '车位服务费更新失败';
                            this.$message.error(errorMsg);
                        }
                    }).catch(error => {
                    console.error('更新车位服务费失败:', error);
                    const errorMsg = error && error.response && error.response.data && error.response.data.msg ? error.response.data.msg : '更新停车位服务费失败';
                    this.$message.error(errorMsg);
                });
            }
        }
    });
</script>

</body>

</html>
