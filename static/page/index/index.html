<script>

    window.onload = function () {
        title.account = location.search.split('account=')[1];
        console.log(title.account)
        // 页面加载时检查用户权限
        left.checkUserPermission();
        
        // 页面加载时检查是否有两天内的发票申请
        left.checkRecentInvoiceApply();
        
        // 点击页面其他地方时关闭下拉菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.right_t')) {
                title.showDropdown = false;
            }
        });
    }

    let title = new Vue({
        el: '#title',
        data: {
            account: '',
            showDropdown: false
        },
        methods: {
            toggleDropdown() {
                this.showDropdown = !this.showDropdown;
            },
            switchAccount() {
                this.showDropdown = false;
                window.location.href = '../login/login.html';
            }
        }
    })

    let left = new Vue({
        el: '#left',
        data: {
            showUserManagement: false,
            showRevenueManagement: false,
            showInvoiceAlert: false,
            select: [
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false},
                {select: true, select_c: false}, // 产品管理
                {select: false, select_c: true}, // 订单管理,默认是在订单管理页面
                {select: true, select_c: false}, // 入网审核
                {select: true, select_c: false}, // 私桩管理
                {select: true, select_c: false}, // 购桩管理
                {select: true, select_c: false}, // 用户管理
                {select: true, select_c: false}, // 职工管理
                {select: true, select_c: false}, // 驿享充车位
                {select: true, select_c: false}, // 分账管理
                {select: true, select_c: false}, // 数据统计
                {select: true, select_c: false}, // 商户管理
                {select: true, select_c: false}, // 余额明细
                {select: true, select_c: false}, // 发票明细
            ],

            jiantou: [
                {jiantou_xia: false, jiantou_zuo: true},
                {jiantou_xia: false, jiantou_zuo: true},
            ],

            chesuo_zk: false,

            xiaoxi_zk: false,

            // 订单管理下拉相关
            order_zk: false,
            orderJiantou: 'jiantou_zuo',
            order_c: [
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
            ],

            chesuo_c: [
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
            ],

            xiaoxi_c: [
                {chicked: false, chesuo_zk: true},
                {chicked: false, chesuo_zk: true},
            ]
        },
        methods: {
            // 检查用户权限
            checkUserPermission() {
                let self = this;
                // 使用原生JavaScript调用后端接口检查用户权限
                let xhr = new XMLHttpRequest();
                let url = '/system/checkAdmin?account=' + encodeURIComponent(title.account);
                
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                let response = JSON.parse(xhr.responseText);
                                if (response.code === 200) {
                                    // 只有当isAdmin值为2时才显示用户管理选项
                                    if (response.data && response.data.isAdmin === 2) {
                                        self.showUserManagement = true;
                                    } else {
                                        self.showUserManagement = false;
                                    }
                                    
                                    // 当isAdmin值为1或2时才显示收益管理选项
                                    if (response.data && (response.data.isAdmin === 1 || response.data.isAdmin === 2)) {
                                        self.showRevenueManagement = true;
                                    } else {
                                        self.showRevenueManagement = false;
                                    }
                                } else {
                                    console.error('权限检查失败:', response.msg);
                                    self.showUserManagement = false;
                                    self.showRevenueManagement = false;
                                }
                            } catch (e) {
                                console.error('解析响应数据失败:', e);
                                self.showUserManagement = false;
                                self.showRevenueManagement = false;
                            }
                        } else {
                            console.error('权限检查请求失败，状态码:', xhr.status);
                            self.showUserManagement = false;
                            self.showRevenueManagement = false;
                        }
                    }
                };
                xhr.send();
            },
            
            // 检查是否有两天内的发票申请
            checkRecentInvoiceApply() {
                let self = this;
                // 使用原生JavaScript调用后端接口检查发票申请
                let xhr = new XMLHttpRequest();
                let url = '/system/invoice/checkRecentApply';
                
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                let response = JSON.parse(xhr.responseText);
                                if (response.code === 200 && response.data === true) {
                                    // 有两天内的发票申请，显示弹窗
                                    self.showInvoiceApplyAlert();
                                }
                            } catch (e) {
                                console.error('解析发票申请检查响应失败:', e);
                            }
                        } else {
                            console.error('发票申请检查请求失败，状态码:', xhr.status);
                        }
                    }
                };
                xhr.send();
            },
            
            // 显示发票申请提示弹窗
            showInvoiceApplyAlert() {
                // 显示自定义弹窗
                this.showInvoiceAlert = true;
            },
            
            // 关闭发票申请提示弹窗
            closeInvoiceAlert() {
                this.showInvoiceAlert = false;
            },
            
            // 查看发票明细
            viewInvoiceDetail() {
                // 关闭弹窗
                this.showInvoiceAlert = false;
                // 跳转到发票明细页面
                this.select_c(24);
            },
            
            //选中index选项
            select_c(index) {
                console.log("当前点击的是:", index)
                this.option_change(index)

                if (index != 2 && index != 5 && index != 13) {
                    right.right_url = right.url[index];
                }

                if (index == 2) {
                    this.chesuo_change();
                }

                if (index == 5) {
                    this.xiaoxi_change();
                }

                if (index == 13) {
                    this.order_change();
                }

                for (let i = 0; i < this.chesuo_c.length; i++) {
                    this.chesuo_c[i].chicked = false
                }

                for (let i = 0; i < this.xiaoxi_c.length; i++) {
                    this.xiaoxi_c[i].chicked = false
                }

                for (let i = 0; i < this.order_c.length; i++) {
                    this.order_c[i].chicked = false
                }

            },

            option_change(index) {
                for (let i = 0; i < this.select.length; i++) {
                    this.select[i].select_c = false
                    this.select[i].select = true
                }
                this.select[index].select_c = true
                this.select[index].select = false
            },

            //车锁列表打开或关闭
            chesuo_change() {
                if (this.chesuo_zk) {
                    this.chesuo_zk = false;
                    this.jiantou[0].jiantou_zuo = true;
                    this.jiantou[0].jiantou_xia = false;
                } else {
                    this.chesuo_zk = true;
                    this.jiantou[0].jiantou_zuo = false;
                    this.jiantou[0].jiantou_xia = true;
                }
            },

            xiaoxi_change() {
                if (this.xiaoxi_zk) {
                    this.xiaoxi_zk = false;
                    this.jiantou[1].jiantou_zuo = true;
                    this.jiantou[1].jiantou_xia = false;
                } else {
                    this.xiaoxi_zk = true;
                    this.jiantou[1].jiantou_zuo = false;
                    this.jiantou[1].jiantou_xia = true;
                }
            },

            chesuo_ck(index) {
                for (let i = 0; i < this.chesuo_c.length; i++) {
                    this.chesuo_c[i].chicked = false
                }
                this.chesuo_c[index].chicked = true

                right.right_url = right.LockBean[index];

                this.option_change(2)
            },

            // 订单管理下拉展开/关闭
            order_change() {
                if (this.order_zk) {
                    this.order_zk = false;
                    this.orderJiantou = 'jiantou_zuo';
                } else {
                    this.order_zk = true;
                    this.orderJiantou = 'jiantou_xia';
                    // 展开时显示原有订单管理页面
                    right.right_url = right.url[13];
                }
            },

            // 订单管理子选项点击
            order_ck(index) {
                for (let i = 0; i < this.order_c.length; i++) {
                    this.order_c[i].chicked = false
                }
                this.order_c[index].chicked = true

                // 根据选择的类型跳转到订单管理页面，并传递类型参数
                right.right_url = right.OrderType[index];

                this.option_change(13)
            },

            xiaoxi_ck(index) {
                for (let i = 0; i < this.xiaoxi_c.length; i++) {
                    this.xiaoxi_c[i].chicked = false
                }
                this.xiaoxi_c[index].chicked = true

                this.option_change(5)
            }

        }
    })

    let right = new Vue({
        el: '#right',
        data: {
            right_url: '../option/order_list/orderManage.html',
            url: [
                "../option/yezhu/yezhu.html",
                "../option/place_list/place_list.html",
                "../option/yezhu/yezhu.html",
                "../option/yezhu/yezhu.html",
                "../option/money_show/money_show.html",
                "../option/yezhu/yezhu.html",
                "../option/pwdChange/pwdChange.html",
                "../option/charge_list/charge_list.html",
                "../option/LoRa/LoRa.html",
                "../option/om_enable/om_enable.html",
                "../option/charge_total/charge_total.html",
                "../option/charge_total_four/charge_total_four.html",
                "../option/product_list/product_list.html",
                "../option/order_list/orderManage.html",
                "../option/private_pile_audit/private_pile_audit.html",
                "../option/private_charging/private_charging.html", // 私桩管理
                "../option/purchase_pile_manage/purchasePileManage.html", // 购桩管理
                "../option/user_manage/user_manage.html", // 用户管理
                "../option/employee/employee.html", // 职工管理
                "../option/parking_spaces/parking_spaces.html", // 驿享充车位
                "../option/profit_sharing_config/profit_sharing_config.html", // 分账管理
                "../option/data_statistics/data_statistics.html", // 数据统计
                "../option/hotel_management/hotel_management.html", // 商户管理
                "../option/balance_detail/balance_detail.html", // 余额明细
                "../option/invoice_detail/invoice_detail.html", // 发票明细
            ],
            LockBean: [
                "../option/dev_list/dev_list.html",
                // "../option/yezhu/yezhu.html",
                "../option/charging_station_list/charging_station_list.html",
                "../option/dev_fault/dev_fault.html",
                "../option/charge_state/charge_state.html",
            ],
            // 订单类型对应的URL，传递type参数
            OrderType: [
                "../option/order_list/orderManage.html?type=驿享充电",
                "../option/order_list/orderManage.html?type=邻享充电",
                "../option/order_list/orderManage.html?type=踩踩停车",
                "../option/order_list/orderManage.html?type=二轮车充电",
            ]
        },
        methods: {}
    })

</script>
